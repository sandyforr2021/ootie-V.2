service: ootie-ai-gateway
region: asia-southeast1
ingress: all
allowUnauthenticated: true
scaling:
  minInstances: 0
  maxInstances: 2
container:
  cpu: 1
  memory: 1Gi
  concurrency: 4
  timeoutSeconds: 600
runtimeServiceAccount: REQUIRED_OOTIE_AI_GATEWAY_PROD_SERVICE_ACCOUNT
environment:
  NODE_ENV: production
  AI_IMAGE_GENERATION_ENABLED: "false"
  AI_MAX_IMAGES_PER_USER_PER_DAY: "3"
  CORS_ALLOWED_ORIGINS: REQUIRED_PRODUCTION_CANONICAL_ORIGIN
  SUPABASE_URL: REQUIRED_PRODUCTION_SUPABASE_URL
  SUPABASE_PUBLISHABLE_KEY: REQUIRED_PRODUCTION_PUBLISHABLE_KEY
  GOOGLE_CLOUD_PROJECT: ferrous-phoenix-16888
  GOOGLE_CLOUD_LOCATION_STYLING: asia-southeast1
  GOOGLE_CLOUD_LOCATION_VTO: asia-southeast1
  GOOGLE_CLOUD_LOCATION_IMAGE: asia-southeast1
  GOOGLE_VTO_MODEL: REQUIRED_APPROVED_VTO_MODEL
  GOOGLE_IMAGE_MODEL: REQUIRED_APPROVED_IMAGE_MODEL
  GOOGLE_STYLING_MODEL: REQUIRED_APPROVED_STYLING_MODEL
secretBindings:
  SUPABASE_SERVICE_ROLE_KEY: REQUIRED_PRODUCTION_SECRET_MANAGER_VERSION

