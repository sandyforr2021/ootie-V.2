<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OOTIE Shopping Companion</title><link rel="stylesheet" href="popup.css"></head>
<body><header><strong class="brand">ootie.</strong><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option><option value="es">Español</option></select></header>
<main><h1 data-copy="heading"></h1><p data-copy="intro"></p><p id="status" role="status" aria-live="polite"></p>
<form id="productForm"><figure><img id="preview" alt=""><figcaption data-copy="preview"></figcaption></figure>
<label><span data-copy="title"></span><input id="title" required maxlength="160"></label>
<label><span data-copy="link"></span><input id="url" type="url"></label>
<label><span data-copy="image"></span><input id="image" type="url"></label>
<details><summary data-copy="setup"></summary><label><span data-copy="endpoint"></span><input id="endpoint" type="url" required></label><small data-copy="setupHint"></small></details>
<button type="submit" id="send" data-copy="send"></button><button type="button" id="refresh" class="secondary" data-copy="refresh"></button></form>
<p class="privacy" data-copy="privacy"></p></main><script type="module" src="popup.js"></script></body></html>
